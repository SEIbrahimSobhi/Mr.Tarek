<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب</title>
  <link rel="stylesheet" href="assets/css/auth.css">

  <!-- تحميل مكتبة EmailJS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <!-- تهيئة EmailJS باستخدام المفتاح العام -->
  <script type="text/javascript">
    (function() {
      emailjs.init("K0gXc0-X0CONTIkX_");
    })();
  </script>

  <!-- مكتبات Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    // تكوين Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
      authDomain: "mr-tarek-2e40f.firebaseapp.com",
      projectId: "mr-tarek-2e40f",
      storageBucket: "mr-tarek-2e40f.appspot.com",
      messagingSenderId: "807997869740",
      appId: "1:807997869740:web:8eca7473d24693bf861909"
    };

    // تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // دالة إرسال البريد الإلكتروني باستخدام EmailJS
    const sendVerificationEmail = async (email, verificationCode) => {
      try {
        await emailjs.send("service_4de4l3i", "template_gqjxtul", {
          email: email,
          verification_code: verificationCode
        });
        console.log("تم إرسال البريد الإلكتروني بنجاح");
      } catch (error) {
        console.error("خطأ أثناء إرسال البريد الإلكتروني:", error);
        throw new Error("حدث خطأ أثناء إرسال البريد الإلكتروني.");
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      let generatedCode = null;
      let emailForVerification = null;
      let lastSentTime = null; // وقت آخر إرسال للكود
      let timerInterval = null;

      // تحديث العداد
      const startTimer = (duration) => {
        const countdownElement = document.getElementById("countdown");
        let remainingTime = duration;

        countdownElement.textContent = `رمز التحقق صالح لمدة ${remainingTime} ثانية`;

        timerInterval = setInterval(() => {
          remainingTime--;
          countdownElement.textContent = `رمز التحقق صالح لمدة ${remainingTime} ثانية`;

          if (remainingTime <= 0) {
            clearInterval(timerInterval);
            document.getElementById("resend-code").disabled = false;
            countdownElement.textContent = "انتهت صلاحية رمز التحقق. يمكنك طلب رمز جديد.";
          }
        }, 1000);
      };

      // إرسال رمز التحقق
      const sendCode = async (email) => {
        generatedCode = Math.floor(100000 + Math.random() * 900000); // توليد رمز عشوائي
        lastSentTime = new Date().getTime();

        try {
          await setDoc(doc(db, "email_verifications", email), {
            verificationCode: generatedCode,
            createdAt: new Date().toISOString()
          });

          await sendVerificationEmail(email, generatedCode);
          alert("تم إرسال رمز التحقق إلى بريدك الإلكتروني.");
          document.getElementById("resend-code").disabled = true;
          startTimer(300); // بدء العداد (300 ثانية = 5 دقائق)
        } catch (error) {
          console.error("خطأ أثناء إرسال رمز التحقق:", error);
          alert("حدث خطأ أثناء إرسال رمز التحقق.");
        }
      };

      // عند إنشاء الحساب
      document.getElementById("register-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const studentName = document.getElementById("student-name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !studentName || !phone || !email || !password) {
          alert("يرجى ملء جميع الحقول.");
          return;
        }

        try {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          await setDoc(doc(db, "users", user.uid), {
            username,
            studentName,
            phone,
            email,
            emailVerified: false
          });

          emailForVerification = email;
          await sendCode(email);

          document.getElementById("register-form").style.display = "none";
          document.getElementById("verification-section").style.display = "block";
        } catch (error) {
          console.error("خطأ أثناء إنشاء الحساب:", error);
          alert("حدث خطأ أثناء إنشاء الحساب.");
        }
      });

      // زر إعادة إرسال الكود
      document.getElementById("resend-code").addEventListener("click", async () => {
        if (document.getElementById("resend-code").disabled) {
          alert("لا يمكنك إعادة الإرسال الآن. يرجى الانتظار حتى انتهاء العداد.");
          return;
        }

        await sendCode(emailForVerification);
      });

      // التحقق من الرمز
      document.getElementById("verify-code").addEventListener("click", async () => {
        const enteredCode = document.getElementById("verification-code").value.trim();

        try {
          const userDocRef = doc(db, "email_verifications", emailForVerification);
          const userDocSnap = await getDoc(userDocRef);

          if (userDocSnap.exists() && userDocSnap.data().verificationCode == enteredCode) {
            alert("تم تأكيد البريد الإلكتروني بنجاح!");
            window.location.href = "index.html";
          } else {
            alert("رمز التحقق غير صحيح أو انتهت صلاحيته.");
          }
        } catch (error) {
          console.error("خطأ أثناء التحقق:", error);
          alert("حدث خطأ أثناء التحقق.");
        }
      });
    });
  </script>
</head>
<body>
  <div class="auth-container">
    <h1>إنشاء حساب</h1>
    <form id="register-form">
      <input type="text" id="username" placeholder="اسم المستخدم" required>
      <input type="text" id="student-name" placeholder="اسم الطالب" required>
      <input type="tel" id="phone" placeholder="رقم الهاتف" required>
      <input type="email" id="email" placeholder="الإيميل" required>
      <input type="password" id="password" placeholder="كلمة المرور" required>
      <button type="submit">إنشاء حساب</button>
    </form>

    <div id="verification-section" style="display: none;">
      <h2>تأكيد البريد الإلكتروني</h2>
      <p id="countdown">رمز التحقق صالح لمدة 5 دقائق</p>
      <input type="text" id="verification-code" placeholder="رمز التحقق" required>
      <button id="verify-code">تحقق</button>
      <button id="resend-code" disabled>إعادة إرسال رمز التحقق</button>
    </div>
  </div>
</body>
</html>
