<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب</title>
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <div class="auth-container">
    <h1>إنشاء حساب</h1>
    <form id="register-form">
      <input type="text" id="username" placeholder="اسم المستخدم" required>
      <input type="text" id="student-name" placeholder="اسم الطالب" required>
      <input type="tel" id="phone" placeholder="رقم الهاتف" required>
      <input type="email" id="email" placeholder="الإيميل" required>
      <input type="password" id="password" placeholder="كلمة المرور" required>
      <button type="submit">إنشاء حساب</button>
    </form>
  </div>
  
<!-- قاعده البيانات -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

// تهيئة Firebase
const firebaseConfig = {
  apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
  authDomain: "mr-tarek-2e40f.firebaseapp.com",
  projectId: "mr-tarek-2e40f",
  storageBucket: "mr-tarek-2e40f.appspot.com",
  messagingSenderId: "807997869740",
  appId: "1:807997869740:web:8eca7473d24693bf861909"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// استمع إلى حدث الضغط على زر "إنشاء حساب"
document.querySelector("button[type='submit']").addEventListener("click", async (e) => {
  e.preventDefault();

  // اجمع البيانات من الحقول
  const username = document.getElementById("username").value.trim();
  const studentName = document.getElementById("student-name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    // إنشاء الحساب
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    console.log("تم إنشاء الحساب:", user);

    // حفظ البيانات الإضافية في Firestore
    await setDoc(doc(db, "users", user.uid), {
      username: username,
      fullName: studentName,
      phone: phone,
      email: email
    });
    console.log("تم حفظ بيانات المستخدم بنجاح!");

    // إعادة توجيه المستخدم إلى الصفحة الرئيسية
    window.location.href = "index.html";
  } catch (error) {
    console.error("خطأ أثناء إنشاء الحساب:", error.message);
    alert("فشل إنشاء الحساب: " + error.message);
  }
});
</script>
</body>
</html>
