<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب</title>
  <link rel="stylesheet" href="assets/css/auth.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="text/javascript">
    (function () {
      emailjs.init("K0gXc0-X0CONTIkX_"); // مفتاح EmailJS العام
    })();
  </script>
</head>
<body>
  <section>
    <div class="form-box">
      <div class="form-value">
        <form id="register-form">
          <h2>إنشاء حساب</h2>
          
          <!-- اسم المستخدم -->
          <div class="inputbox">
            <input type="text" id="username" required>
            <ion-icon name="person-outline" class="icon"></ion-icon>
            <label for="username">اسم المستخدم</label>
          </div>

          <!-- اسم الطالب -->
          <div class="inputbox">
            <input type="text" id="student-name" required>
            <ion-icon name="person-outline" class="icon"></ion-icon>
            <label for="student-name">اسم الطالب</label>
          </div>

          <!-- رقم الهاتف -->
          <div class="inputbox">
            <input type="tel" id="phone" required>
            <ion-icon name="call-outline" class="icon"></ion-icon>
            <label for="phone">رقم الهاتف</label>
          </div>

          <!-- البريد الإلكتروني -->
          <div class="inputbox">
            <input type="email" id="email" required>
            <ion-icon name="mail-outline" class="icon"></ion-icon>
            <label for="email">الإيميل</label>
          </div>

          <!-- كلمة المرور -->
          <div class="inputbox">
            <input type="password" id="password" required>
            <ion-icon name="lock-closed-outline" class="icon"></ion-icon>
            <label for="password">كلمة المرور</label>
            <button type="button" id="toggle-password" class="toggle-password">
              <ion-icon name="eye-outline"></ion-icon>
            </button>
          </div>

          <button type="submit">إنشاء حساب</button>
          <a href="login.html" class="switch-link">لديك حساب؟ تسجيل الدخول</a>
        </form>
      </div>
    </div>

    <!-- قسم التحقق من البريد الإلكتروني -->
    <div id="verification-section" style="display: none;">
      <div class="verification-box">
        <h2>تأكيد البريد الإلكتروني</h2>
        <p>تم إرسال رمز التحقق إلى بريدك الإلكتروني. يرجى إدخال الرمز:</p>
        <div class="inputbox">
          <input type="text" id="verification-code" placeholder="رمز التحقق" required>
        </div>
        <button id="verify-code">تحقق</button>
        <p id="countdown">صلاحية الرمز: 3:00</p>
        <button id="resend-code" style="display: none;">إعادة إرسال الرمز</button>
      </div>
    </div>
  </section>

  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <script>
    const togglePassword = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePassword.querySelector('ion-icon').name = isPassword ? 'eye-off-outline' : 'eye-outline';
    });
  </script>
</body>
</html>
