<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب</title>
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <div class="auth-container">
    <h1>إنشاء حساب</h1>
    <form id="register-form">
      <input type="text" id="username" placeholder="اسم المستخدم" required>
      <input type="text" id="student-name" placeholder="اسم الطالب" required>
      <input type="tel" id="phone" placeholder="رقم الهاتف" required>
      <input type="email" id="email" placeholder="الإيميل" required>
      <input type="password" id="password" placeholder="كلمة المرور" required>
      <button type="submit">إنشاء حساب</button>
    </form>
    
    <!-- قسم التحقق -->
    <div id="verification-section" style="display: none;">
      <h2>تأكيد البريد الإلكتروني</h2>
      <p>تم إرسال رمز التأكيد إلى بريدك الإلكتروني. أدخل الرمز أدناه:</p>
      <input type="text" id="verification-code" placeholder="رمز التحقق" required>
      <button id="verify-code">تحقق</button>
    </div>
  </div>
  
  <!-- قاعده البيانات -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

// تهيئة Firebase
const firebaseConfig = {
  apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
  authDomain: "mr-tarek-2e40f.firebaseapp.com",
  projectId: "mr-tarek-2e40f",
  storageBucket: "mr-tarek-2e40f.appspot.com",
  messagingSenderId: "807997869740",
  appId: "1:807997869740:web:8eca7473d24693bf861909"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// استمع إلى حدث الضغط على زر "إنشاء حساب"
document.querySelector("button[type='submit']").addEventListener("click", async (e) => {
  e.preventDefault();

  // اجمع البيانات من الحقول
  const username = document.getElementById("username").value.trim();
  const studentName = document.getElementById("student-name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    // إنشاء الحساب
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    // إرسال بريد التحقق
    await sendEmailVerification(user);
    console.log("تم إرسال رمز التحقق إلى البريد الإلكتروني:", email);

    // إظهار قسم التحقق
    document.getElementById("register-form").style.display = "none";
    document.getElementById("verification-section").style.display = "block";

    // استمع إلى التحقق من الرمز
    document.getElementById("verify-code").addEventListener("click", async () => {
      if (user.emailVerified) {
        // تأكيد التحقق
        await setDoc(doc(db, "users", user.uid), {
          username: username,
          fullName: studentName,
          phone: phone,
          email: email
        });
        console.log("تم حفظ بيانات المستخدم بنجاح!");
        alert("تم إنشاء الحساب وتأكيد البريد بنجاح!");
        window.location.href = "index.html";
      } else {
        alert("لم يتم التحقق من بريدك الإلكتروني. يرجى التحقق من بريدك.");
      }
    });
  } catch (error) {
    console.error("خطأ أثناء إنشاء الحساب:", error.message);
    alert("فشل إنشاء الحساب: " + error.message);
  }
});
</script>
</body>
</html>
