<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب</title>
  <link rel="stylesheet" href="assets/css/auth.css">

  <!-- تحميل مكتبة EmailJS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <!-- تهيئة EmailJS باستخدام المفتاح العام -->
  <script type="text/javascript">
    (function(){
      emailjs.init("K0gXc0-X0CONTIkX_"); // مفتاح EmailJS العام
    })();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    // تكوين Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
      authDomain: "mr-tarek-2e40f.firebaseapp.com",
      projectId: "mr-tarek-2e40f",
      storageBucket: "mr-tarek-2e40f.appspot.com",
      messagingSenderId: "807997869740",
      appId: "1:807997869740:web:8eca7473d24693bf861909"
    };

    // تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // دالة إرسال البريد الإلكتروني باستخدام EmailJS
    const sendVerificationEmail = async (email, verificationCode) => {
      try {
        // إرسال البريد الإلكتروني إلى البريد المدخل من قبل المستخدم
        await emailjs.send("service_4de4l3i", "template_gqjxtul", {
          email: email,  // البريد الإلكتروني الذي أدخله المستخدم
          verification_code: verificationCode
        });
        console.log("تم إرسال البريد الإلكتروني بنجاح");
      } catch (error) {
        console.error("خطأ أثناء إرسال البريد الإلكتروني:", error);
        throw new Error("حدث خطأ أثناء إرسال البريد الإلكتروني.");
      }
    };

    // ارسال النموذج والتسجيل
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("register-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const studentName = document.getElementById("student-name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !studentName || !phone || !email || !password) {
          alert("يرجى ملء جميع الحقول.");
          return;
        }

        try {
          // محاولة إنشاء المستخدم
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;
          console.log("تم إنشاء الحساب بنجاح");

          // توليد رمز التحقق
          const verificationCode = Math.floor(100000 + Math.random() * 900000);

          // حفظ بيانات المستخدم في Firestore
          await setDoc(doc(db, "users", user.uid), {
            username,
            studentName,
            phone,
            email,
            verificationCode,
            emailVerified: false
          });

          // إرسال البريد الإلكتروني
          await sendVerificationEmail(email, verificationCode);

          alert("تم إنشاء الحساب بنجاح! تم إرسال رمز التحقق إلى بريدك الإلكتروني.");
          document.getElementById("register-form").style.display = "none";
          document.getElementById("verification-section").style.display = "block";
        } catch (error) {
          console.error("خطأ أثناء إنشاء الحساب:", error);
          if (error.code === "auth/email-already-in-use") {
            alert("البريد الإلكتروني مستخدم بالفعل.");
          } else {
            alert("حدث خطأ أثناء إنشاء الحساب. تأكد من صحة بياناتك وحاول مرة أخرى.");
          }
        }
      });

      // دالة التحقق من الرمز
      document.getElementById("verify-code").addEventListener("click", async () => {
        const enteredCode = document.getElementById("verification-code").value.trim();

        try {
          const userDocRef = doc(db, "users", auth.currentUser.uid);
          const userDocSnap = await getDoc(userDocRef);

          if (userDocSnap.exists() && userDocSnap.data().verificationCode == enteredCode) {
            await setDoc(userDocRef, { emailVerified: true }, { merge: true });
            alert("تم تأكيد البريد الإلكتروني بنجاح!");
            window.location.href = "index.html";
          } else {
            alert("رمز التحقق غير صحيح.");
          }
        } catch (error) {
          console.error("خطأ أثناء التحقق من الرمز:", error);
          alert("حدث خطأ أثناء التحقق.");
        }
      });
    });
  </script>
</head>
<body>
  <div class="auth-container">
    <h1>إنشاء حساب</h1>
    <form id="register-form">
      <input type="text" id="username" placeholder="اسم المستخدم" required>
      <input type="text" id="student-name" placeholder="اسم الطالب" required>
      <input type="tel" id="phone" placeholder="رقم الهاتف" required>
      <input type="email" id="email" placeholder="الإيميل" required>
      <input type="password" id="password" placeholder="كلمة المرور" required>
      <button type="submit">إنشاء حساب</button>
    </form>

    <div id="verification-section" style="display: none;">
      <h2>تأكيد البريد الإلكتروني</h2>
      <p>تم إرسال رمز التحقق إلى بريدك الإلكتروني. يرجى إدخال الرمز:</p>
      <input type="text" id="verification-code" placeholder="رمز التحقق" required>
      <button id="verify-code">تحقق</button>
    </div>
  </div>
</body>
</html>
