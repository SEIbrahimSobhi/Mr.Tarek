<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب</title>
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <div class="auth-container">
    <h1>إنشاء حساب</h1>

    <!-- نموذج إنشاء الحساب -->
    <form id="register-form">
      <input type="text" id="username" placeholder="اسم المستخدم" required>
      <input type="text" id="student-name" placeholder="اسم الطالب" required>
      <input type="tel" id="phone" placeholder="رقم الهاتف" required>
      <input type="email" id="email" placeholder="الإيميل" required>
      <input type="password" id="password" placeholder="كلمة المرور" required>
      <button type="submit">إنشاء حساب</button>
    </form>

    <!-- قسم التحقق -->
    <div id="verification-section" style="display: none;">
      <h2>تأكيد البريد الإلكتروني</h2>
      <p>تم إرسال رمز التحقق إلى بريدك الإلكتروني. يرجى إدخال الرمز أدناه:</p>
      <input type="text" id="verification-code" placeholder="رمز التحقق" required>
      <button id="verify-code">تحقق</button>
    </div>
  </div>

  <!-- كود JavaScript للتعامل مع Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    // تهيئة Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
      authDomain: "mr-tarek-2e40f.firebaseapp.com",
      projectId: "mr-tarek-2e40f",
      storageBucket: "mr-tarek-2e40f.appspot.com",
      messagingSenderId: "807997869740",
      appId: "1:807997869740:web:8eca7473d24693bf861909"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // الاستماع إلى نموذج التسجيل
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      // جمع البيانات من الحقول
      const username = document.getElementById("username").value.trim();
      const studentName = document.getElementById("student-name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      // التحقق من صحة البيانات
      if (!username || !studentName || !phone || !email || !password) {
        alert("يرجى ملء جميع الحقول قبل المتابعة.");
        return;
      }

      try {
        // إنشاء حساب جديد
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // إرسال بريد التحقق
        await sendEmailVerification(user);
        console.log("تم إرسال بريد التحقق إلى:", email);

        // إظهار قسم التحقق
        document.getElementById("register-form").style.display = "none";
        document.getElementById("verification-section").style.display = "block";

        // التحقق من رمز البريد الإلكتروني
        document.getElementById("verify-code").addEventListener("click", async () => {
          await user.reload(); // تحديث بيانات المستخدم
          if (user.emailVerified) {
            // حفظ بيانات المستخدم في Firestore
            await setDoc(doc(db, "users", user.uid), {
              username: username,
              fullName: studentName,
              phone: phone,
              email: email
            });

            console.log("تم حفظ البيانات بنجاح!");
            alert("تم إنشاء الحساب وتأكيد البريد الإلكتروني بنجاح!");
            window.location.href = "index.html"; // إعادة التوجيه إلى الصفحة الرئيسية
          } else {
            alert("لم يتم التحقق من بريدك الإلكتروني بعد. يرجى المحاولة مرة أخرى.");
          }
        });
      } catch (error) {
        console.error("حدث خطأ أثناء إنشاء الحساب:", error.message);
        alert("فشل إنشاء الحساب: " + error.message);
      }
    });
  </script>
</body>
</html>
