<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mr.Tarek-إنشاء حساب</title>
  <link rel="stylesheet" href="assets/css/auth.css">
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

<!--   مكتبه ايقونه العين -->
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  
  <!-- EmailJS -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  
</head>
<body>
  <section aria-label="نموذج إنشاء حساب">
    <div class="form-box">
      <div class="form-value">
        <form id="register-form" aria-labelledby="form-title">
          <div class="title-box">
            <h1 id="form-title">إنشاء حساب</h1>
          </div>

          <!-- حقول الإدخال مع ARIA -->
          <div class="inputbox" role="group" aria-labelledby="username-label">
            <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
            <input type="text" id="username" required aria-required="true">
            <label id="username-label" for="username">اسم المستخدم</label>
          </div>

          <div class="inputbox" role="group" aria-labelledby="student-name-label">
            <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
            <input type="text" id="student-name" required aria-required="true">
            <label id="student-name-label" for="student-name">اسم الطالب</label>
          </div>

          <div class="inputbox" role="group" aria-labelledby="phone-label">
            <ion-icon name="call-outline" aria-hidden="true"></ion-icon>
            <input type="tel" id="phone" required aria-required="true" inputmode="tel">
            <label id="phone-label" for="phone">رقم الهاتف</label>
          </div>

          <div class="inputbox" role="group" aria-labelledby="email-label">
            <ion-icon name="mail-outline" aria-hidden="true"></ion-icon>
            <input type="email" id="email" required aria-required="true" inputmode="email">
            <label id="email-label" for="email">الإيميل</label>
          </div>

  <div class="inputbox" role="group" aria-labelledby="password-label">
    <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
     <input type="password" id="password" required aria-required="true">
     <label id="password-label" for="password">كلمة المرور</label>
     <ion-icon 
       name="eye-outline" 
        class="toggle-password"
        aria-label="إظهار كلمة المرور"
         role="button"
         tabindex="0"
        ></ion-icon>
      </div>

          <div class="button-box">
            <button type="submit" aria-busy="false">
              <span class="btn-text">إنشاء حساب</span>
              <span class="loader" hidden></span>
            </button>
            <div class="register">
              <p>لديك حساب؟ <a href="login.html" class="switch-link">تسجيل دخول</a></p>
            </div>
          </div>
        </form>

        <!-- قسم التحقق -->
        <div id="verification-section" style="display: none;" aria-live="polite">
          <div class="verification-box">
            <h2>تأكيد البريد الإلكتروني</h2>
            <p id="verification-instruction">تم إرسال رمز التحقق إلى بريدك الإلكتروني</p>
            
            <div class="inputbox" role="group" aria-labelledby="code-label">
              <input type="text" id="verification-code" 
                     inputmode="numeric"
                     pattern="\d{6}"
                     aria-describedby="code-instruction"
                     required>
              <label id="code-label" for="verification-code">رمز التحقق</label>
            </div>

            <button id="verify-code">تحقق</button>
            <p id="countdown" aria-live="off">صلاحية الرمز: 3:00</p>
            <button id="resend-code" style="display: none;">إعادة إرسال الرمز</button>
          </div>
        </div>

        <!-- نظام الإشعارات -->
        <div id="notification" class="notification" role="alert" aria-live="assertive"></div>
      </div>
    </div>
  </section>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

  // التهيئة
  const firebaseConfig = {
    apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
    authDomain: "mr-tarek-2e40f.firebaseapp.com",
    projectId: "mr-tarek-2e40f",
    storageBucket: "mr-tarek-2e40f.appspot.com",
    messagingSenderId: "807997869740",
    appId: "1:807997869740:web:8eca7473d24693bf861909"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  emailjs.init("K0gXc0-X0CONTIkX_");

  // متغيرات التطبيق
  let verificationCode = null;
  let countdownInterval = null;
  const tempUserKey = 'tempUserData';

  // دوال المساعدة
  const showNotification = (type, message) => {
    const notification = document.getElementById('notification');
    notification.className = `notification ${type}`;
    notification.textContent = message;
    notification.hidden = false;
    setTimeout(() => notification.hidden = true, 3000);
  };

  const validateArabicName = (name) => /^[\u0600-\u06FF\s]{3,30}$/.test(name);

  const validateInputs = (inputs) => {
    try {
      if (!validateArabicName(inputs.username)) throw 'اسم المستخدم غير صالح';
      if (!validateArabicName(inputs.studentName)) throw 'اسم الطالب غير صالح';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(inputs.email)) throw 'بريد إلكتروني غير صالح';
      if (!/^\+?[0-9]{10,15}$/.test(inputs.phone)) throw 'رقم هاتف غير صالح';
      if (inputs.password.length < 8) throw 'كلمة المرور يجب أن تكون 8 أحرف على الأقل';
      return true;
    } catch (error) {
      showNotification('error', error);
      return false;
    }
  };

  const startCountdown = (duration) => {
    clearInterval(countdownInterval);
    let remaining = duration;
    const countdownEl = document.getElementById('countdown');
    
    countdownInterval = setInterval(() => {
      const mins = Math.floor(remaining / 60);
      const secs = remaining % 60;
      countdownEl.textContent = `صلاحية الرمز: ${mins}:${secs.toString().padStart(2, '0')}`;
      
      if (remaining-- <= 0) {
        clearInterval(countdownInterval);
        document.getElementById('resend-code').style.display = 'block';
        showNotification('error', 'انتهت صلاحية الرمز');
      }
    }, 1000);
  };

  const sendVerificationCode = async (email) => {
    try {
      verificationCode = Math.floor(100000 + Math.random() * 900000);
      await emailjs.send("service_4de4l3i", "template_gqjxtul", {
        email,
        verification_code: verificationCode
      });
      return true;
    } catch (error) {
      console.error('Email Error:', error);
      throw 'فشل إرسال رمز التحقق، حاول لاحقاً';
    }
  };

  // أحداث النموذج
  document.addEventListener('DOMContentLoaded', () => {
    const savedData = localStorage.getItem(tempUserKey);
    if (savedData) {
      const { email, code } = JSON.parse(savedData);
      document.getElementById('email').value = email;
      document.getElementById('register-form').style.display = 'none';
      document.getElementById('verification-section').style.display = 'block';
      verificationCode = code;
      startCountdown(180);
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const inputs = {
        username: document.getElementById('username').value.trim(),
        studentName: document.getElementById('student-name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      };

      if (!validateInputs(inputs)) return;

      try {
        await sendVerificationCode(inputs.email);
        localStorage.setItem(tempUserKey, JSON.stringify({
          ...inputs,
          code: verificationCode
        }));
        
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('verification-section').style.display = 'block';
        startCountdown(180);
        showNotification('success', 'تم إرسال رمز التحقق إلى بريدك');
      } catch (error) {
        showNotification('error', error);
      }
    });

    document.getElementById('verify-code').addEventListener('click', async () => {
      const enteredCode = document.getElementById('verification-code').value.trim();
      const storedData = JSON.parse(localStorage.getItem(tempUserKey));

      if (enteredCode !== verificationCode?.toString()) {
        return showNotification('error', 'رمز التحقق غير صحيح');
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(
          auth,
          storedData.email,
          storedData.password
        );

        await setDoc(doc(db, 'users', userCredential.user.uid), {
          username: storedData.username,
          studentName: storedData.studentName,
          phone: storedData.phone,
          email: storedData.email,
          createdAt: new Date().toISOString(),
          emailVerified: true
        });

        localStorage.removeItem(tempUserKey);
        window.location.href = 'index.html';
      } catch (error) {
        showNotification('error', `خطأ في إنشاء الحساب: ${error.code}`);
      }
    });

    document.getElementById('resend-code').addEventListener('click', async () => {
      try {
        await sendVerificationCode(JSON.parse(localStorage.getItem(tempUserKey)).email);
        startCountdown(180);
        showNotification('success', 'تم إعادة إرسال الرمز');
      } catch (error) {
        showNotification('error', error);
      }
    });
  });

  // إدارة كلمة المرور
  document.querySelector('.toggle-password').addEventListener('click', (e) => {
    const passwordInput = document.getElementById('password');
    const isHidden = passwordInput.type === 'password';
    passwordInput.type = isHidden ? 'text' : 'password';
    e.target.setAttribute('name', isHidden ? 'eye-off-outline' : 'eye-outline');
  });
</script>
</body>
</html>
