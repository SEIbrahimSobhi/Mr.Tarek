<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/auth.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
  <div class="auth-container">
    <h1>إنشاء حساب</h1>
    <form id="register-form">
  <input type="text" id="username" placeholder="اسم المستخدم" required>
  <input type="text" id="student-name" placeholder="اسم الطالب" required>
  <input type="tel" id="phone" placeholder="رقم الهاتف" required>
  <input type="email" id="email" placeholder="الإيميل" required>
  <input type="password" id="password" placeholder="كلمة المرور" required>
  <button type="submit">إنشاء حساب</button>
</form>
  </div>
  <script type="module">
  document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const username = document.getElementById('username').value;
  const studentName = document.getElementById('student-name').value;
  const phone = document.getElementById('phone').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const { data, error } = await supabase.from('users').insert([
    { username, student_name: studentName, phone, email, password }
  ]);

  if (error) {
    alert('فشل إنشاء الحساب: ' + error.message);
  } else {
    alert('تم إنشاء الحساب بنجاح!');
    window.location.href = 'index.html';
  }
});
  </script>
</body>
</html>
