<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب</title>
  <link rel="stylesheet" href="assets/css/auth.css">
  <!-- تحميل مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script>
    // تعريف العميل الخاص بـ Supabase
    const supabaseUrl = 'https://wrjkhrtccchhrnmudvkq.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyamtocnRjY2NoaHJubXVkdmtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzQ2NDE4MDQsImV4cCI6MjA1MDIxNzgwNH0.UFt-kMwuloLvmQW0sagwvCQ2buVSh6Ojf-gmLJ6Jd5s';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);
  </script>
</head>
<body>
  <div class="auth-container">
    <h1>إنشاء حساب</h1>
    <form id="register-form">
      <input type="text" id="username" placeholder="اسم المستخدم" required>
      <input type="text" id="student-name" placeholder="اسم الطالب" required>
      <input type="tel" id="phone" placeholder="رقم الهاتف" required>
      <input type="email" id="email" placeholder="الإيميل" required>
      <input type="password" id="password" placeholder="كلمة المرور" required>
      <button type="submit">إنشاء حساب</button>
    </form>
  </div>

  <script>
    // التعامل مع حدث إرسال النموذج
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      // جمع بيانات الحقول
      const username = document.getElementById('username').value;
      const studentName = document.getElementById('student-name').value;
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // إدخال البيانات إلى جدول المستخدمين
      const { data, error } = await supabase
        .from('users')
        .insert([{ username, student_name: studentName, phone, email, password }]);

      if (error) {
        console.error('Error:', error.message);
        alert('فشل إنشاء الحساب: ' + error.message);
      } else {
        console.log('User created:', data);
        alert('تم إنشاء الحساب بنجاح!');
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
