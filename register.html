<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب</title>
  <link rel="stylesheet" href="assets/css/auth.css">
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
      authDomain: "mr-tarek-2e40f.firebaseapp.com",
      projectId: "mr-tarek-2e40f",
      storageBucket: "mr-tarek-2e40f.appspot.com",
      messagingSenderId: "807997869740",
      appId: "1:807997869740:web:8eca7473d24693bf861909"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // SendGrid API Key
    const sendgridApiKey = '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'; // ضع مفتاح API هنا

    // دالة إرسال البريد الإلكتروني باستخدام SendGrid
    const sendVerificationEmail = async (email, verificationCode) => {
      const emailData = {
        personalizations: [
          {
            to: [{ email: email }],
            subject: 'مرحبًا بك في منصة التعليم الخاصة بالأستاذ طارق',
          },
        ],
        from: { email: 'your-email@example.com' }, // البريد الإلكتروني الذي سترسل منه الرسائل
        content: [
          {
            type: 'text/plain',
            value: `مرحبًا بك في منصة التعليم الخاصة بالأستاذ طارق! 

لتفعيل حسابك، يرجى إدخال رمز التحقق التالي: ${verificationCode}

شكرًا لاختيارك منصتنا التعليمية الرائدة. نحن هنا لندعمك في رحلتك الدراسية!

فريق المنصة`,
          },
        ],
      };

      // إرسال الطلب إلى SendGrid API
      const response = await fetch('https://api.sendgrid.com/v3/mail/send', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${sendgridApiKey}`, // هنا يتم إضافة مفتاح الـ API
        },
        body: JSON.stringify(emailData),
      });

      if (response.ok) {
        console.log('تم إرسال البريد الإلكتروني بنجاح');
      } else {
        console.error('حدث خطأ أثناء إرسال البريد الإلكتروني');
      }
    };

    // Form submission
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("register-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const studentName = document.getElementById("student-name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !studentName || !phone || !email || !password) {
          alert("يرجى ملء جميع الحقول.");
          return;
        }

        try {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          // Generate a verification code
          const verificationCode = Math.floor(100000 + Math.random() * 900000);

          // Save user info in Firestore
          await setDoc(doc(db, "users", user.uid), {
            username,
            studentName,
            phone,
            email,
            verificationCode,
            emailVerified: false
          });

          // إرسال البريد الإلكتروني
          await sendVerificationEmail(email, verificationCode);

          alert("تم إنشاء الحساب بنجاح! تم إرسال رمز التحقق إلى بريدك الإلكتروني.");
          document.getElementById("register-form").style.display = "none";
          document.getElementById("verification-section").style.display = "block";
        } catch (error) {
          console.error("Error creating account:", error);
          alert(error.code === "auth/email-already-in-use" ? 
            "البريد الإلكتروني مستخدم بالفعل." : "حدث خطأ أثناء إنشاء الحساب.");
        }
      });

      document.getElementById("verify-code").addEventListener("click", async () => {
        const enteredCode = document.getElementById("verification-code").value.trim();

        try {
          const userDocRef = doc(db, "users", auth.currentUser.uid);
          const userDocSnap = await getDoc(userDocRef);

          if (userDocSnap.exists() && userDocSnap.data().verificationCode == enteredCode) {
            await setDoc(userDocRef, { emailVerified: true }, { merge: true });
            alert("تم تأكيد البريد الإلكتروني بنجاح!");
            window.location.href = "index.html";
          } else {
            alert("رمز التحقق غير صحيح.");
          }
        } catch (error) {
          console.error("Error verifying code:", error);
          alert("حدث خطأ أثناء التحقق.");
        }
      });
    });
  </script>
</head>
<body>
  <div class="auth-container">
    <h1>إنشاء حساب</h1>
    <form id="register-form">
      <input type="text" id="username" placeholder="اسم المستخدم" required>
      <input type="text" id="student-name" placeholder="اسم الطالب" required>
      <input type="tel" id="phone" placeholder="رقم الهاتف" required>
      <input type="email" id="email" placeholder="الإيميل" required>
      <input type="password" id="password" placeholder="كلمة المرور" required>
      <button type="submit">إنشاء حساب</button>
    </form>

    <div id="verification-section" style="display: none;">
      <h2>تأكيد البريد الإلكتروني</h2>
      <p>تم إرسال رمز التحقق إلى بريدك الإلكتروني. يرجى إدخال الرمز:</p>
      <input type="text" id="verification-code" placeholder="رمز التحقق" required>
      <button id="verify-code">تحقق</button>
    </div>
  </div>
</body>
</html>
