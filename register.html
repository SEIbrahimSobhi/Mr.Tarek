<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr.Tarek-إنشاء حساب</title>
  <link rel="stylesheet" href="assets/css/auth.css">
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.10.2/lottie.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script type="text/javascript">
    (function () {
      emailjs.init("K0gXc0-X0CONTIkX_");
    })();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
      authDomain: "mr-tarek-2e40f.firebaseapp.com",
      projectId: "mr-tarek-2e40f",
      storageBucket: "mr-tarek-2e40f.appspot.com",
      messagingSenderId: "807997869740",
      appId: "1:807997869740:web:8eca7473d24693bf861909"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let countdownInterval;
    let verificationCode;
    let userInfo;

    const showNotification = (type, message) => {
      const notification = document.getElementById("notification");
      const messageElement = document.getElementById("notification-message");
      const successIcon = document.getElementById("success-icon");
      const errorIcon = document.getElementById("error-icon");

      messageElement.textContent = message;

      if (type === "success") {
        successIcon.classList.remove("hidden");
        errorIcon.classList.add("hidden");
      } else if (type === "error") {
        successIcon.classList.add("hidden");
        errorIcon.classList.remove("hidden");
      }

      notification.classList.remove("hidden");
      setTimeout(() => {
        notification.classList.add("hidden");
      }, 3000);
    };

    const sendVerificationEmail = async (email, verificationCode) => {
      try {
        await emailjs.send("service_4de4l3i", "template_gqjxtul", {
          email: email,
          verification_code: verificationCode
        });
        console.log("تم إرسال البريد الإلكتروني بنجاح");
      } catch (error) {
        console.error("خطأ أثناء إرسال البريد الإلكتروني:", error);
        throw new Error("حدث خطأ أثناء إرسال البريد الإلكتروني.");
      }
    };

    const startCountdown = (duration) => {
      const countdownElement = document.getElementById("countdown");
      let remainingTime = duration;

      countdownInterval = setInterval(() => {
        const minutes = Math.floor(remainingTime / 60);
        const seconds = remainingTime % 60;

        countdownElement.textContent = `صلاحية الرمز: ${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;

        if (remainingTime <= 0) {
          clearInterval(countdownInterval);
          showNotification("error", "انتهت صلاحية الرمز. يرجى طلب رمز جديد.");
          countdownElement.textContent = "انتهت صلاحية الرمز.";
          document.getElementById("resend-code").style.display = "block";
        }

        remainingTime--;
      }, 1000);
    };

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("register-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const studentName = document.getElementById("student-name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !studentName || !phone || !email || !password) {
          showNotification("error", "يرجى ملء جميع البيانات.");
          return;
        }

        try {
          verificationCode = Math.floor(100000 + Math.random() * 900000);
          userInfo = { username, studentName, phone, email, password };
          await sendVerificationEmail(email, verificationCode);

          showNotification("success", "تم إرسال رمز التحقق إلى بريدك الإلكتروني.");
          document.getElementById("register-form").style.display = "none";
          document.getElementById("verification-section").style.display = "block";
          startCountdown(180);
        } catch (error) {
          console.error("خطأ أثناء إنشاء الحساب:", error);
          showNotification("error", "حدث خطأ أثناء إرسال رمز التحقق. حاول مرة أخرى.");
        }
      });

      document.getElementById("verify-code").addEventListener("click", async () => {
        const enteredCode = document.getElementById("verification-code").value.trim();

        if (parseInt(enteredCode, 10) === verificationCode) {
          try {
            const userCredential = await createUserWithEmailAndPassword(auth, userInfo.email, userInfo.password);
            const user = userCredential.user;

            await setDoc(doc(db, "users", user.uid), {
              ...userInfo,
              emailVerified: true,
              role: "student"
            });

            showNotification("success", "تم انشاء حساب.");
            window.location.href = "index.html";
          } catch (error) {
            console.error("خطأ أثناء إنشاء الحساب:", error);
            showNotification("error", "حدث خطأ أثناء إنشاء الحساب.");
          }
        } else {
          showNotification("error", "رمز التحقق غير صحيح.");
        }
      });

      document.getElementById("resend-code").addEventListener("click", async () => {
        try {
          verificationCode = Math.floor(100000 + Math.random() * 900000);
          await sendVerificationEmail(userInfo.email, verificationCode);
          showNotification("success", "تم إرسال رمز تحقق جديد.");
          document.getElementById("resend-code").style.display = "none";
          startCountdown(180);
        } catch (error) {
          console.error("خطأ أثناء إعادة إرسال الرمز:", error);
          showNotification("error", "حدث خطأ أثناء إرسال رمز التحقق. حاول مرة أخرى.");
        }
      });
    });
  </script>
</head>
<body>
  <section>
    <div class="form-box">
      <div class="form-value">
        <form id="register-form">
          <div class="title-box">
            <h2>إنشاء حساب</h2>
          </div>
          <div class="inputbox">
            <ion-icon name="person-outline"></ion-icon>
            <input type="text" id="username" required>
            <label for="username">اسم المستخدم</label>
          </div>
          <div class="inputbox">
            <ion-icon name="person-outline"></ion-icon>
            <input type="text" id="student-name" required>
            <label for="student-name">اسم الطالب</label>
          </div>
          <div class="inputbox">
            <ion-icon name="call-outline"></ion-icon>
            <input type="tel" id="phone" required>
            <label for="phone">رقم الهاتف</label>
          </div>
          <div class="inputbox">
            <ion-icon name="mail-outline"></ion-icon>
            <input type="email" id="email" required>
            <label for="email">الإيميل</label>
          </div>
          <div class="inputbox">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type="password" id="password" required>
            <label for="password">كلمة المرور</label>
          </div>
          <div class="forget">
            <label>
              <input type="checkbox" id="show-password">  show password
            </label>
          </div>
          <div class="button-box">
            <button type="submit">إنشاء حساب</button>
            <div class="register">
              <p>لديك حساب؟ <a href="login.html" class="switch-link">تسجيل دخول</a></p>
            </div>
          </div>
        </form>
        <div id="notification" class="notification hidden">
          <p id="notification-message"></p>
          <div class="icon">
            <div id="success-icon" class="circle hidden">
              <span>✔</span>
            </div>
            <div id="error-icon" class="circle hidden">
              <span>✘</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
