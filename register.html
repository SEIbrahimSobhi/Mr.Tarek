<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب</title>
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <div class="auth-container">
    <h1>إنشاء حساب</h1>
    <form id="register-form">
      <input type="text" id="username" placeholder="اسم المستخدم" required>
      <input type="text" id="student-name" placeholder="اسم الطالب" required>
      <input type="tel" id="phone" placeholder="رقم الهاتف" required>
      <input type="email" id="email" placeholder="الإيميل" required>
      <input type="password" id="password" placeholder="كلمة المرور" required>
      <button type="submit">إنشاء حساب</button>
    </form>
  </div>
  
<!-- قاعده البيانات -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

// تهيئة Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyDpRC4zqWJPtZw2CUvem131S92Kk05lzmA",
    authDomain: "mr-tarek-86f94.firebaseapp.com",
    projectId: "mr-tarek-86f94",
    storageBucket: "mr-tarek-86f94.firebasestorage.app",
    messagingSenderId: "505019693217",
    appId: "1:505019693217:web:45b9a3ab460453553698e0"
  };

const app = initializeApp(firebaseConfig);

// تهيئة Firebase Authentication
const auth = getAuth(app);
</script>
  
<!-- انشاء حساب -->
  <script type="module">
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

// استمع إلى حدث الضغط على زر "إنشاء حساب"
document.querySelector("button[type='submit']").addEventListener("click", async (e) => {
  e.preventDefault();

  // اجمع البيانات من الحقول
  const username = document.getElementById("username").value;
  const studentName = document.getElementById("student-name").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    // إنشاء الحساب في Firebase
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    console.log("تم إنشاء الحساب بنجاح:", user);

    // إعادة توجيه المستخدم إلى الصفحة الرئيسية
    window.location.href = "index.html"; // استبدل "index.html" برابط صفحتك الرئيسية
  } catch (error) {
    console.error("خطأ أثناء إنشاء الحساب:", error.message);
    alert("فشل إنشاء الحساب: " + error.message);
  }
});
  </script>
</body>
</html>
