<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب</title>
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <div class="auth-container">
    <h1>إنشاء حساب</h1>
    <form id="register-form">
      <input type="text" id="username" placeholder="اسم المستخدم" required>
      <input type="text" id="student-name" placeholder="اسم الطالب" required>
      <input type="tel" id="phone" placeholder="رقم الهاتف" required>
      <input type="email" id="email" placeholder="الإيميل" required>
      <input type="password" id="password" placeholder="كلمة المرور" required>
      <button type="submit">إنشاء حساب</button>
    </form>
  </div>
  
<!-- قاعده البيانات -->
<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDpRC4zqWJPtZw2CUvem131S92Kk05lzmA",
    authDomain: "mr-tarek-86f94.firebaseapp.com",
    projectId: "mr-tarek-86f94",
    storageBucket: "mr-tarek-86f94.firebasestorage.app",
    messagingSenderId: "505019693217",
    appId: "1:505019693217:web:45b9a3ab460453553698e0"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
</script>
<!-- انشاء حساب -->
  <script>
    document.getElementById('register-form').addEventListener('submit', async (event) => {
  event.preventDefault();

  const username = document.getElementById('username').value;
  const studentName = document.getElementById('student-name').value;
  const phone = document.getElementById('phone').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
    const userId = userCredential.user.uid;

    // إضافة بيانات المستخدم إلى Firestore
    await db.collection('users').doc(userId).set({
      username,
      studentName,
      phone,
      email
    });

    alert('تم إنشاء الحساب بنجاح!');
    window.location.href = 'index.html'; // توجيه للصفحة الرئيسية
  } catch (error) {
    alert(`خطأ أثناء إنشاء الحساب: ${error.message}`);
  }
});
  </script>
</body>
</html>
