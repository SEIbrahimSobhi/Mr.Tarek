<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Mr.Tarek-إنشاء حساب</title>

    <!-- الموارد الخارجية -->
    <link rel="stylesheet" href="assets/css/auth.css">
    <link href="assets/img/favicon.png" rel="icon">
    <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.10.2/lottie.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>

    <!-- تهيئة EmailJS -->
    <script type="text/javascript">
        (function() {
            emailjs.init("K0gXc0-X0CONTIkX_");
        })();
    </script>
</head>
<body>
    <section aria-label="نموذج إنشاء حساب">
        <div class="form-box">
            <div class="form-value">
                <!-- نموذج التسجيل -->
                <form id="register-form" aria-labelledby="form-title">
                    <h1 id="form-title">إنشاء حساب</h1>

                    <div class="inputbox" role="group" aria-labelledby="username-label">
                        <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
                        <input type="text" id="username" required aria-required="true">
                        <label id="username-label" for="username">اسم المستخدم</label>
                    </div>

                    <div class="inputbox" role="group" aria-labelledby="student-name-label">
                        <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
                        <input type="text" id="student-name" required aria-required="true">
                        <label id="student-name-label" for="student-name">اسم الطالب</label>
                    </div>

                    <div class="inputbox" role="group" aria-labelledby="phone-label">
                        <ion-icon name="call-outline" aria-hidden="true"></ion-icon>
                        <input type="tel" id="phone" required aria-required="true" inputmode="tel">
                        <label id="phone-label" for="phone">رقم الهاتف</label>
                    </div>

                    <div class="inputbox" role="group" aria-labelledby="email-label">
                        <ion-icon name="mail-outline" aria-hidden="true"></ion-icon>
                        <input type="email" id="email" required aria-required="true" inputmode="email">
                        <label id="email-label" for="email">الإيميل</label>
                    </div>

                    <div class="inputbox" role="group" aria-labelledby="password-label">
                        <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
                        <input type="password" id="password" required aria-required="true">
                        <label id="password-label" for="password">كلمة المرور</label>
                    </div>

                    <div class="forget">
                        <label>
                            <input type="checkbox" id="show-password" aria-label="إظهار كلمة المرور">
                            إظهار كلمة المرور
                        </label>
                    </div>

                    <div class="button-box">
                        <button type="submit" aria-busy="false">
                            <span class="btn-text">إنشاء حساب</span>
                            <span class="loader" hidden></span>
                        </button>
                        <p class="register">لديك حساب؟ <a href="login.html" class="switch-link">تسجيل دخول</a></p>
                    </div>
                </form>

                <!-- قسم التحقق -->
                <div id="verification-section" style="display: none;" aria-live="polite">
                    <div class="verification-box">
                        <h2>تأكيد البريد الإلكتروني</h2>
                        <p id="verification-instruction">تم إرسال رمز التحقق إلى بريدك الإلكتروني</p>

                        <div class="inputbox" role="group" aria-labelledby="code-label">
                            <input type="text" id="verification-code"
                                   inputmode="numeric"
                                   pattern="\d{6}"
                                   aria-describedby="code-instruction"
                                   required>
                            <label id="code-label" for="verification-code">رمز التحقق</label>
                        </div>

                        <button id="verify-code">تحقق</button>
                        <p id="countdown" aria-live="off">صلاحية الرمز: 3:00</p>
                        <button id="resend-code" style="display: none;">إعادة إرسال الرمز</button>
                    </div>
                </div>

                <!-- نظام الإشعارات -->
                <div id="notification" class="notification" role="alert" aria-live="assertive"></div>
            </div>
        </div>
    </section>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    // تكوين Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
        authDomain: "mr-tarek-2e40f.firebaseapp.com",
        projectId: "mr-tarek-2e40f",
        storageBucket: "mr-tarek-2e40f.appspot.com",
        messagingSenderId: "807997869740",
        appId: "1:807997869740:web:8eca7473d24693bf861909"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let countdownInterval;
    let verificationCode;
    let tempUserData = JSON.parse(localStorage.getItem('tempUser')) || {};

    // دالة التحقق من المدخلات
    const validateInputs = (inputs) => {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const phoneRegex = /^\+?[0-9]{10,15}$/;

        if (!inputs.username.match(/^[\u0600-\u06FF\s]{3,30}$/)) {
            showNotification("error", "اسم المستخدم غير صالح");
            return false;
        }

        if (!emailRegex.test(inputs.email)) {
            showNotification("error", "البريد الإلكتروني غير صالح");
            return false;
        }

        if (!phoneRegex.test(inputs.phone)) {
            showNotification("error", "رقم الهاتف يجب أن يحتوي 10-15 رقم");
            return false;
        }

        if (inputs.password.length < 8) {
            showNotification("error", "كلمة المرور يجب أن تكون 8 أحرف على الأقل");
            return false;
        }

        return true;
    };

    const startCountdown = (duration) => {
        const countdownElement = document.getElementById("countdown");
        let remainingTime = duration;

        clearInterval(countdownInterval);

        countdownInterval = setInterval(() => {
            const minutes = Math.floor(remainingTime / 60);
            const seconds = remainingTime % 60;
            countdownElement.textContent = `صلاحية الرمز: ${minutes}:${seconds.toString().padStart(2, '0')}`;

            if (remainingTime <= 0) {
                clearInterval(countdownInterval);
                showNotification("error", "انتهت صلاحية الرمز");
                document.getElementById("resend-code").style.display = "block";
            }

            remainingTime--;
        }, 1000);
    };

    const sendVerificationEmail = async (email, code) => {
        try {
            await emailjs.send("service_4de4l3i", "template_gqjxtul", {
                email: email,
                verification_code: code
            });
        } catch (error) {
            console.error("فشل إرسال البريد:", error);
            throw new Error("فشل إرسال البريد الإلكتروني");
        }
    };

    document.addEventListener("DOMContentLoaded", () => {
        const bcrypt = window.dcodeIO?.bcrypt;

        // استعادة البيانات المؤقتة
        if (tempUserData.email) {
            document.getElementById("email").value = tempUserData.email;
            document.getElementById("register-form").style.display = "none";
            document.getElementById("verification-section").style.display = "block";
            startCountdown(180);
        }

        document.getElementById("register-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            toggleLoading(true);

            const inputs = {
                username: document.getElementById("username").value.trim(),
                studentName: document.getElementById("student-name").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            };

            if (!Object.values(inputs).every(Boolean)) {
                showNotification("error", "يرجى ملء جميع البيانات");
                toggleLoading(false);
                return;
            }

            if (!validateInputs(inputs)) {
                toggleLoading(false);
                return;
            }

            try {
                verificationCode = Math.floor(100000 + Math.random() * 900000);
                const hashedPassword = bcrypt.hashSync(inputs.password, bcrypt.genSaltSync(10));

                tempUserData = {
                    ...inputs,
                    password: hashedPassword,
                    verificationCode
                };

                localStorage.setItem('tempUser', JSON.stringify(tempUserData));
                await sendVerificationEmail(inputs.email, verificationCode);

                showNotification("success", "تم إرسال رمز التحقق");
                document.getElementById("register-form").style.display = "none";
                document.getElementById("verification-section").style.display = "block";
                startCountdown(180);
            } catch (error) {
                showNotification("error", error.message);
            } finally {
                toggleLoading(false);
            }
        });

        document.getElementById("verify-code").addEventListener("click", async () => {
            const enteredCode = document.getElementById("verification-code").value.trim();

            if (enteredCode !== tempUserData.verificationCode?.toString()) {
                showNotification("error", "رمز التحقق غير صحيح");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(
                    auth,
                    tempUserData.email,
                    tempUserData.password
                );

                await setDoc(doc(db, "users", userCredential.user.uid), {
                    ...tempUserData,
                    emailVerified: true,
                    createdAt: new Date().toISOString()
                });

                localStorage.removeItem('tempUser');
                showNotification("success", "تم إنشاء الحساب بنجاح");
                setTimeout(() => window.location.href = "index.html", 2000);
            } catch (error) {
                showNotification("error", "فشل إنشاء الحساب: " + error.message);
            }
        });

        document.getElementById("resend-code").addEventListener("click", async () => {
            try {
                verificationCode = Math.floor(100000 + Math.random() * 900000);
                tempUserData.verificationCode = verificationCode;
                localStorage.setItem('tempUser', JSON.stringify(tempUserData));

                await sendVerificationEmail(tempUserData.email, verificationCode);
                showNotification("success", "تم إعادة إرسال الرمز");
                startCountdown(180);
                document.getElementById("resend-code").style.display = "none";
            } catch (error) {
                showNotification("error", error.message);
            }
        });
    });

    function toggleLoading(state) {
        const btn = document.querySelector('button[type="submit"]');
        btn.ariaBusy = state;
        btn.disabled = state;
        btn.querySelector('.btn-text').hidden = state;
        btn.querySelector('.loader').hidden = !state;
    }
</script>

    <!-- الأيقونات ونظام الإشعارات -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
