<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب</title>
  <link rel="stylesheet" href="assets/css/auth.css">
  <!-- تحميل مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
  <div class="auth-container">
    <h1>إنشاء حساب</h1>
    <form id="register-form">
      <input type="text" id="username" placeholder="اسم المستخدم" required>
      <input type="text" id="student-name" placeholder="اسم الطالب" required>
      <input type="tel" id="phone" placeholder="رقم الهاتف" required>
      <input type="email" id="email" placeholder="الإيميل" required>
      <input type="password" id="password" placeholder="كلمة المرور" required>
      <button type="submit">إنشاء حساب</button>
    </form>
  </div>

  <script>
    // التأكد من أن مكتبة Supabase محملة بالكامل
    document.addEventListener("DOMContentLoaded", () => {
      // تعريف العميل الخاص بـ Supabase
      const supabaseUrl = 'https://wrjkhrtccchhrnmudvkq.supabase.co';
      const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyamtocnRjY2NoaHJubXVkdmtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzQ2NDE4MDQsImV4cCI6MjA1MDIxNzgwNH0.UFt-kMwuloLvmQW0sagwvCQ2buVSh6Ojf-gmLJ6Jd5s';
      const supabase = supabase.createClient(supabaseUrl, supabaseKey);

      // التعامل مع النموذج
      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        // استرجاع بيانات الإدخال
        const username = document.getElementById('username').value.trim();
        const studentName = document.getElementById('student-name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        // التحقق من البيانات قبل الإرسال (اختياري)
        if (!username || !studentName || !phone || !email || !password) {
          alert('يرجى ملء جميع الحقول.');
          return;
        }

        try {
          // إدخال البيانات في قاعدة البيانات
          const { data, error } = await supabase
            .from('users')
            .insert([{ username, student_name: studentName, phone, email, password }]);

          if (error) {
            console.error('Error:', error.message);
            alert('فشل إنشاء الحساب: ' + error.message);
          } else {
            console.log('User created:', data);
            alert('تم إنشاء الحساب بنجاح!');
            window.location.href = 'index.html';
          }
        } catch (err) {
          console.error('Unexpected Error:', err);
          alert('حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى.');
        }
      });
    });
  </script>
</body>
</html>
