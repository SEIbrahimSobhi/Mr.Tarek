<body>
  <!-- صورة الموبايل (للشاشات الصغيرة فقط) -->

    <img src="assets/img/register.jpeg" alt="صورة المنصة">

  </div>
  <!-- الحاوية الرئيسية للشاشات الكبيرة -->
  <div class="main-desktop">
    <!-- صورة الديسكتوب (للشاشات الكبيرة فقط) -->

      <img src="assets/img/register.jpeg" alt="صورة المنصة">
      <div class="overlay"></div>
    </div>
    <!-- قسم النموذج -->
    <div class="form-container">
      <!-- صفحة تسجيل الدخول -->
      <div class="form-wrapper" id="login-page">
        <div class="form-header">
          <h1>
            <span class="white">تسجيل</span> <span class="blue">الدخول:</span>
          </h1>
          <p>أدخل بياناتك لتسجيل الدخول إلى حسابك.</p>
        </div>
        <form id="login-form">
          <!-- حقل البريد الإلكتروني أو رقم الهاتف -->
          <div class="form-group">
            <!-- تم تغيير نوع الإدخال إلى text ليسمح بإدخال رقم الهاتف -->

            <i class="form-icon fas fa-envelope"></i>
            <label for="login-email" class="form-label">البريد الإلكتروني أو رقم الهاتف</label>
          </div>
          <!-- حقل كلمة المرور -->
          <div class="form-group">
            <input type="password" id="login-password" class="form-control" placeholder=" " required>
            <i class="form-icon fas fa-lock"></i>
            <label for="login-password" class="form-label">كلمة المرور</label>
          </div>
          <!-- زر تسجيل الدخول -->
          <div class="row" style="justify-content: center; gap: 20px; margin-bottom: 20px;">
            <button type="submit" class="submit-btn">تسجيل الدخول</button>
          </div>
          <!-- رابط إنشاء حساب جديد -->
          <div class="login-link">
            <span>لا تملك حساب؟</span>
            <a href="register.html">أنشئ حسابك الآن!</a>

        </form>
      </div>
    </div>
  </div>
  <footer>
    <div class="footer-top">

        <img src="assets/img/favicon.png" alt="Logo">

          <h2>Mr.Tarek</h2>
          <h4>منصه الرياضيات</h4>
        </div>
      </div>
      <div class="footer-support">
        <h3>الدعم</h3>
        <p>
          Phone: <a href="tel:+201128471221" class="support-number">+201128471221</a><br>
          WhatsApp: <a href="https://wa.me/201128471221" target="_blank" class="support-number">+201128471221</a>
        </p>
        <p class="support-note">في حال وجود أي مشكلة، يرجى التواصل مع الدعم.</p>
      </div>
    </div>
    <div class="footer-bottom">

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
  import { getFirestore, query, collection, where, getDocs } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

  // إعدادات Firebase - تأكد من مطابقتها لإعدادات مشروعك
  const firebaseConfig = {
    apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
    authDomain: "mr-tarek-2e40f.firebaseapp.com",
    projectId: "mr-tarek-2e40f",
    storageBucket: "mr-tarek-2e40f.firebasestorage.app",
    messagingSenderId: "807997869740",
    appId: "1:807997869740:web:8eca7473d24693bf861909",
    measurementId: "G-K9HZRGMPKK"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // نظام الإشعارات كما هو موجود لديك
  class NotificationManager {
    constructor() {
      this.queue = [];
      this.isActive = false;
      this.currentNotification = null;
    }
    createNotification(type, message) {
      const notification = document.createElement('div');
      notification.className = `notification-center notification-${type}`;
      notification.innerHTML = `
        <div class="notification-icon">
          <svg viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="30" fill="none" stroke-width="3"></circle>
          </svg>
          <ion-icon name="${type === 'success' ? 'checkmark' : 'close'}-outline"></ion-icon>
        </div>
        <h3 class="notification-title">${type === 'success' ? 'عملية ناجحة' : 'خطأ في التنفيذ'}</h3>
        <p class="notification-message">${message}</p>
      `;
      notification.addEventListener('click', () => this.dismiss());
      return notification;
    }
    showNotification(type, message, duration = 3000) {
      if (this.isActive) {
        this.queue.push({ type, message, duration });
        return;
      }
      this.isActive = true;
      this.currentNotification = this.createNotification(type, message);
      document.body.appendChild(this.currentNotification);
      setTimeout(() => {
        this.currentNotification.classList.add('active');
      }, 50);
      setTimeout(() => this.dismiss(), duration);
    }
    dismiss() {
      if (!this.currentNotification) return;
      this.currentNotification.classList.remove('active');
      setTimeout(() => {
        if (this.currentNotification && this.currentNotification.parentElement) {
          this.currentNotification.remove();
        }
        this.isActive = false;
        this.currentNotification = null;
        this.processQueue();
      }, 400);
    }
    processQueue() {
      if (this.queue.length > 0) {
        const next = this.queue.shift();
        this.showNotification(next.type, next.message, next.duration);
      }
    }
  }
  const notificationSystem = new NotificationManager();
  function showNotification(type, message, duration) {
    notificationSystem.showNotification(type, message, duration);
  }

  // حدث تسجيل الدخول
  document.getElementById('login-form').addEventListener('submit', async (event) => {
    event.preventDefault();

    const identifier = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value.trim();

    if (!identifier || !password) {
      showNotification("error", "يرجى إدخال البريد الإلكتروني/رقم الهاتف وكلمة المرور.", 3000);
      return;
    }

    try {
      let email = identifier;

      if (!identifier.includes('@')) {
        // البحث عن البريد الإلكتروني باستخدام رقم الهاتف
        const usersRef = collection(db, "users");
        const q = query(usersRef, where("phone", "==", identifier));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          showNotification("error", "رقم الهاتف غير مسجل. الرجاء التحقق من بياناتك.", 3000);
          return;
        }

        querySnapshot.forEach((doc) => {
          email = doc.data().email;
        });
      }

      // تأكد من أن البريد الإلكتروني ليس فارغاً ويظهر في الـ console
      console.log("البريد الإلكتروني المستخدم:", email);
      console.log("كلمة المرور:", password);

      // يمكنك تحويل البريد الإلكتروني إلى حروف صغيرة للتأكد من تطابقه مع ما هو مسجل
      email = email.toLowerCase();

      await signInWithEmailAndPassword(auth, email, password);
      showNotification("success", "تم تسجيل الدخول بنجاح!", 3000);
      window.location.href = 'index.html';
    } catch (error) {
      console.error("Login error:", error);
      showNotification("error", "حدثت مشكلة أثناء تسجيل الدخول. يرجى التحقق من بياناتك والمحاولة مرة أخرى.", 3000);
    }
  });
</script>
</body>
