<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <div class="auth-container">
    <h1>تسجيل الدخول</h1>
    <form id="login-form">
      <input type="text" id="identifier" placeholder="اسم المستخدم أو رقم الهاتف أو الإيميل" required>
      <input type="password" id="password" placeholder="كلمة المرور" required>
      <button type="submit">تسجيل الدخول</button>
    </form>
    <p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></p>
  </div>
  
<!-- قاعده البيانات -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

// تهيئة Firebase
const firebaseConfig = {
  apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
  authDomain: "mr-tarek-2e40f.firebaseapp.com",
  projectId: "mr-tarek-2e40f",
  storageBucket: "mr-tarek-2e40f.firebasestorage.app",
  messagingSenderId: "807997869740",
  appId: "1:807997869740:web:8eca7473d24693bf861909"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById('login-form').addEventListener('submit', async (event) => {
  event.preventDefault();

  const identifier = document.getElementById('identifier').value;
  const password = document.getElementById('password').value;

  try {
    // تسجيل الدخول بالبريد الإلكتروني
    const userCredential = await auth.signInWithEmailAndPassword(identifier, password);
    alert('تم تسجيل الدخول بنجاح!');
    window.location.href = 'index.html';
  } catch (error) {
    alert(`خطأ أثناء تسجيل الدخول: ${error.message}`);
  }
});
</script>
</body>
</html>
