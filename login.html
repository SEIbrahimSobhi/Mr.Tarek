<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr.Tarek - تسجيل الدخول</title>
  <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">
  <!-- ملف css -->
  <link rel="stylesheet" href="assets/css/auth.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.10.2/lottie.min.js"></script>
</head>
<body>
  <section>
    <div class="form-box">
      <div class="form-value">
        <form id="login-form">
          <h2>تسجيل الدخول</h2>
          <div class="inputbox">
            <ion-icon name="mail-outline"></ion-icon>
            <input type="email" id="email" required>
            <label for="email">الإيميل</label>
          </div>
          <div class="inputbox" role="group" aria-labelledby="password-label">
    <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
     <input type="password" id="password" required aria-required="true">
     <label id="password-label" for="password">كلمة المرور</label>
     <ion-icon 
       name="eye-outline" 
        class="toggle-password"
        aria-label="إظهار كلمة المرور"
         role="button"
         tabindex="0"
        ></ion-icon>
      </div>
          <div class="button-box">
            <button type="submit">تسجيل دخول</button>
            <div class="register">
              <p>ليس لديك حساب؟ <a href="register.html" class="switch-link">إنشاء حساب</a></p>
            </div>
          </div>
        </form>
     <div id="notification" class="notification" role="alert" aria-live="assertive"></div>
    </div>
  </section>
  
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, query, collection, where } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

  // تهيئة Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
    authDomain: "mr-tarek-2e40f.firebaseapp.com",
    projectId: "mr-tarek-2e40f",
    storageBucket: "mr-tarek-2e40f.firebasestorage.app",
    messagingSenderId: "807997869740",
    appId: "1:807997869740:web:8eca7473d24693bf861909"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  document.getElementById('login-form').addEventListener('submit', async (event) => {
    event.preventDefault();

    const identifier = document.getElementById('email').value;  // استخدام الـ ID الخاص بالبريد الإلكتروني
    const password = document.getElementById('password').value;

    try {
      let email = identifier;

      // إذا كان الإدخال ليس بريدًا إلكترونيًا، البحث في قاعدة البيانات
      if (!identifier.includes('@')) {
        const usersRef = collection(db, "users"); // تأكد أن "users" هو اسم مجموعة المستخدمين لديك
        const q = query(usersRef, where("username", "==", identifier)); // البحث عن اسم المستخدم
        const querySnapshot = await getDoc(q);

        if (querySnapshot.empty) {
          showNotification("اسم المستخدم غير موجود. الرجاء التحقق من بياناتك.", "error");
          return;
        }

        // الحصول على البريد الإلكتروني للمستخدم
        querySnapshot.forEach((doc) => {
          email = doc.data().email;
        });
      }

      // تسجيل الدخول باستخدام البريد الإلكتروني
      await signInWithEmailAndPassword(auth, email, password);
      showNotification("تم تسجيل الدخول بنجاح!", "success");
      window.location.href = 'index.html';
    } catch (error) {
      // إخفاء تفاصيل الخطأ البرمجي عن المستخدم وعرض رسالة عامة
      showNotification("حدثت مشكلة أثناء تسجيل الدخول. يرجى التحقق من بياناتك والمحاولة مرة أخرى.", "error");
    }
  });
</script>

  <script>
    // Show/Hide password functionality
    const showPasswordCheckbox = document.getElementById('show-password');
    const passwordInput = document.getElementById('password');

    showPasswordCheckbox.addEventListener('change', () => {
      if (showPasswordCheckbox.checked) {
        passwordInput.type = 'text';
      } else {
        passwordInput.type = 'password';
      }
    });
  </script>

  <script>
    const showNotification = (message, type = "success", duration = 3000) => {
      const notificationContainer = document.getElementById("notification");
      const notificationMessage = document.getElementById("notification-message");
      const successIcon = document.getElementById("success-icon");
      const errorIcon = document.getElementById("error-icon");

      // تغيير النص بناءً على الرسالة
      notificationMessage.textContent = message;

      // إظهار الأيقونات بناءً على النوع
      if (type === "success") {
        successIcon.classList.remove("hidden");
        errorIcon.classList.add("hidden");
      } else {
        successIcon.classList.add("hidden");
        errorIcon.classList.remove("hidden");
      }

      // عرض الرسالة
      notificationContainer.classList.remove("hidden");
      notificationContainer.classList.add("show");

      // إخفاء الرسالة بعد مدة
      setTimeout(() => {
        notificationContainer.classList.remove("show");
        notificationContainer.classList.add("hidden");
      }, duration);
    };
  </script>

    <script>
    // إدارة حالة التحميل
    function toggleLoading(state) {
      const btn = document.querySelector('button[type="submit"]');
      btn.ariaBusy = state;
      btn.querySelector('.btn-text').hidden = state;
      btn.querySelector('.loader').hidden = !state;
    }

    // إظهار/إخفاء كلمة المرور
document.querySelector('.toggle-password').addEventListener('click', function(e) {
  const passwordInput = document.getElementById('password');
  const isPassword = passwordInput.type === 'password';
  
  passwordInput.type = isPassword ? 'text' : 'password';
  this.classList.toggle('active');
  this.setAttribute('name', isPassword ? 'eye-off-outline' : 'eye-outline');
});

// إضافة دعم للضغط على مفتاح Enter للأيقونة
document.querySelector('.toggle-password').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    this.click();
  }
});

    // نظام الإشعارات
function showNotification(type, message, duration = 3000) {
    const notification = document.getElementById('notification');
      notification.className = `notification ${type}`;
      notification.textContent = message;
      notification.style.display = 'block';

      setTimeout(() => {
        notification.hidden = true;
      }, duration);
    }
  </script>
</body>
</html>
