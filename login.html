<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr.Tarek - إنشاء حساب</title>
  <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">
  <!-- ملف CSS -->
  <link rel="stylesheet" href="assets/css/auth.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.10.2/lottie.min.js"></script>
</head>
<body>
  <section>
    <div class="form-box">
      <div class="form-value">
        <form id="register-form">
          <h2>إنشاء حساب</h2>
          <div class="inputbox">
            <ion-icon name="person-outline"></ion-icon>
            <input type="text" id="username" required>
            <label for="username">اسم المستخدم</label>
          </div>
          <div class="inputbox">
            <ion-icon name="mail-outline"></ion-icon>
            <input type="email" id="email" required>
            <label for="email">الإيميل</label>
          </div>
          <div class="inputbox">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type="password" id="password" required>
            <label for="password">كلمة المرور</label>
          </div>
          <div class="inputbox">
            <ion-icon name="lock-closed-outline"></ion-icon>
            <input type="password" id="confirm-password" required>
            <label for="confirm-password">تأكيد كلمة المرور</label>
          </div>
          <div class="button-box">
            <button type="submit">إنشاء حساب</button>
            <div class="register">
              <p>هل لديك حساب؟ <a href="login.html" class="switch-link">تسجيل الدخول</a></p>
            </div>
          </div>
        </form>
        <div id="notification" class="notification hidden">
          <p id="notification-message"></p>
          <div id="notification-icon"></div>
        </div>
      </div>
    </div>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
      authDomain: "mr-tarek-2e40f.firebaseapp.com",
      projectId: "mr-tarek-2e40f",
      storageBucket: "mr-tarek-2e40f.appspot.com",
      messagingSenderId: "807997869740",
      appId: "1:807997869740:web:8eca7473d24693bf861909"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('register-form').addEventListener('submit', async (event) => {
      event.preventDefault();

      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        showNotification("كلمات المرور غير متطابقة.", "error");
        return;
      }

      try {
        await createUserWithEmailAndPassword(auth, email, password);
        showNotification("تم إنشاء الحساب بنجاح!", "success");
        setTimeout(() => {
          window.location.href = "login.html";
        }, 2000);
      } catch (error) {
        const errorMessage = error.message || "خطأ أثناء إنشاء الحساب.";
        showNotification(errorMessage, "error");
      }
    });
  </script>

    <script>
    function showNotification(type, message) {
  const notification = document.getElementById("notification");
  const successIcon = document.getElementById("success-icon");
  const errorIcon = document.getElementById("error-icon");
  const notificationMessage = document.getElementById("notification-message");

  // Reset state
  notification.classList.remove("show", "hidden");
  successIcon.classList.add("hidden");
  errorIcon.classList.add("hidden");

  // Update state based on type
  if (type === "success") {
    notification.classList.add("success", "show");
    successIcon.classList.remove("hidden");
  } else if (type === "error") {
    notification.classList.add("error", "show");
    errorIcon.classList.remove("hidden");
  }

  // Set message
  notificationMessage.textContent = message;

  // Show notification for 3 seconds
  setTimeout(() => {
    notification.classList.remove("show");
    notification.classList.add("hidden");
  }, 3000);
}

</script>

  <script>
    const showPasswordCheckbox = document.getElementById('show-password');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');

    showPasswordCheckbox.addEventListener('change', () => {
      const type = showPasswordCheckbox.checked ? 'text' : 'password';
      passwordInput.type = type;
      confirmPasswordInput.type = type;
    });
  </script>
</body>
</html>
