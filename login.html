<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
  import { getFirestore, query, collection, where, getDocs } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

  // إعدادات Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyD92u7H0l0HANXlY6FaFk2qfcZ30txpdos",
    authDomain: "project-hema.firebaseapp.com",
    projectId: "project-hema",
    storageBucket: "project-hema.firebasestorage.app",
    messagingSenderId: "1079729179279",
    appId: "1:1079729179279:web:39270a2a2cd1850744fefa",
    measurementId: "G-YFSTXKFQ9E"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ==================== نظام الإشعارات ====================
  class NotificationManager {
    constructor() {
      this.queue = [];
      this.isActive = false;
      this.currentNotification = null;
    }
    createNotification(type, message) {
      const notification = document.createElement('div');
      notification.className = `notification-center notification-${type}`;
      notification.innerHTML = `
        <div class="notification-icon">
          <svg viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="30" fill="none" stroke-width="3"></circle>
          </svg>
          <ion-icon name="${type === 'success' ? 'checkmark' : 'close'}-outline"></ion-icon>
        </div>
        <h3 class="notification-title">${type === 'success' ? 'عملية ناجحة' : 'خطأ في التنفيذ'}</h3>
        <p class="notification-message">${message}</p>
      `;
      notification.addEventListener('click', () => this.dismiss());
      return notification;
    }
    showNotification(type, message, duration = 3000) {
      if (this.isActive) {
        this.queue.push({ type, message, duration });
        return;
      }
      this.isActive = true;
      this.currentNotification = this.createNotification(type, message);
      document.body.appendChild(this.currentNotification);
      setTimeout(() => {
        this.currentNotification.classList.add('active');
      }, 50);
      setTimeout(() => this.dismiss(), duration);
    }
    dismiss() {
      if (!this.currentNotification) return;
      this.currentNotification.classList.remove('active');
      setTimeout(() => {
        if (this.currentNotification && this.currentNotification.parentElement) {
          this.currentNotification.remove();
        }
        this.isActive = false;
        this.currentNotification = null;
        this.processQueue();
      }, 400);
    }
    processQueue() {
      if (this.queue.length > 0) {
        const next = this.queue.shift();
        this.showNotification(next.type, next.message, next.duration);
      }
    }
  }
  const notificationSystem = new NotificationManager();
  function showNotification(type, message, duration) {
    notificationSystem.showNotification(type, message, duration);
  }
  // ==================== نهاية نظام الإشعارات ====================

  // الحدث الخاص بتسجيل الدخول
  document.getElementById('login-form').addEventListener('submit', async (event) => {
    event.preventDefault();

    const identifier = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value.trim();

    if (!identifier || !password) {
      showNotification("error", "يرجى إدخال البريد الإلكتروني/اسم المستخدم وكلمة المرور.", 3000);
      return;
    }

    try {
      let email = identifier;
      // إذا لم يحتوي الإدخال على '@' نعتبره اسم مستخدم ونبحث عن البريد الإلكتروني في مجموعة "users"
      if (!identifier.includes('@')) {
        const usersRef = collection(db, "users");
        const q = query(usersRef, where("username", "==", identifier));
        const querySnapshot = await getDocs(q);
        if (querySnapshot.empty) {
          showNotification("error", "اسم المستخدم غير موجود. الرجاء التحقق من بياناتك.", 3000);
          return;
        }
        querySnapshot.forEach((doc) => {
          email = doc.data().email;
        });
      }

      console.log("البريد الإلكتروني المستخدم:", email);
      console.log("كلمة المرور:", password);

      // محاولة تسجيل الدخول باستخدام Firebase Auth
      await signInWithEmailAndPassword(auth, email, password);
      const user = auth.currentUser;
      console.log("المستخدم الحالي:", user.uid);

      let approved = false;
      let accountStatus = null;

      // البحث عن الوثيقة في مجموعة "users" باستخدام استعلام على حقل uid
      const usersQuery = query(collection(db, "users"), where("uid", "==", user.uid));
      const usersSnapshot = await getDocs(usersQuery);
      console.log("عدد الوثائق في users:", usersSnapshot.size);
      if (!usersSnapshot.empty) {
        usersSnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          console.log("وثيقة من users:", data);
          accountStatus = data.accountStatus;
          if (accountStatus === "approved" || accountStatus === "activated") {
            approved = true;
          }
        });
      } else {
        // إذا لم توجد الوثيقة في "users"، نحاول البحث في "pending_users"
        const pendingQuery = query(collection(db, "pending_users"), where("uid", "==", user.uid));
        const pendingSnapshot = await getDocs(pendingQuery);
        console.log("عدد الوثائق في pending_users:", pendingSnapshot.size);
        if (!pendingSnapshot.empty) {
          pendingSnapshot.forEach((docSnap) => {
            const data = docSnap.data();
            console.log("وثيقة من pending_users:", data);
            accountStatus = data.accountStatus;
            if (accountStatus === "approved" || accountStatus === "activated") {
              approved = true;
            }
          });
        }
      }

      if (!approved) {
        showNotification("error", "حسابك غير مفعل أو معلق. يرجى انتظار الموافقة من المسؤول.");
        await signOut(auth);
        return;
      }

      showNotification("success", "تم تسجيل الدخول بنجاح!", 3000);
      window.location.href = 'index.html';
    } catch (error) {
      console.error("Login error:", error);
      showNotification("error", "بيانات الاعتماد غير صحيحة أو الحساب غير مفعل.", 3000);
    }
  });

  function toggleLoading(state) {
    const btn = document.querySelector('button[type="submit"]');
    if (btn) {
      btn.ariaBusy = state;
    }
  }
</script>
