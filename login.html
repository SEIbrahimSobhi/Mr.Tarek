<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr.Tarek-تسجيل الدخول</title>
  <link href="assets/img/favicon.png" rel="icon">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap');
*{
    margin: 0;
    padding: 0;
    font-family: 'poppins',sans-serif;
}
section{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    width: 100%;
    
    background: url('background6.jpg')no-repeat;
    background-position: center;
    background-size: cover;
}
.form-box{
    position: relative;
    width: 400px;
    height: 450px;
    background: transparent;
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 20px;
    backdrop-filter: blur(15px);
    display: flex;
    justify-content: center;
    align-items: center;

}
h2{
    font-size: 2em;
    color: #fff;
    text-align: center;
}
.inputbox{
    position: relative;
    margin: 30px 0;
    width: 310px;
    border-bottom: 2px solid #fff;
}
.inputbox label{
    position: absolute;
    top: 50%;
    left: 5px;
    transform: translateY(-50%);
    color: #fff;
    font-size: 1em;
    pointer-events: none;
    transition: .5s;
}
input:focus ~ label,
input:valid ~ label{
top: -5px;
}
.inputbox input {
    width: 100%;
    height: 50px;
    background: transparent;
    border: none;
    outline: none;
    font-size: 1em;
    padding:0 35px 0 5px;
    color: #fff;
}
.inputbox ion-icon{
    position: absolute;
    right: 8px;
    color: #fff;
    font-size: 1.2em;
    top: 20px;
}
.forget{
    margin: -15px 0 15px ;
    font-size: .9em;
    color: #fff;
    display: flex;
    justify-content: space-between;  
}

.forget label input{
    margin-right: 3px;
    
}
.forget label a{
    color: #fff;
    text-decoration: none;
}
.forget label a:hover{
    text-decoration: underline;
}
button{
    width: 100%;
    height: 40px;
    border-radius: 40px;
    background: #fff;
    border: none;
    outline: none;
    cursor: pointer;
    font-size: 1em;
    font-weight: 600;
}
.register{
    font-size: .9em;
    color: #fff;
    text-align: center;
    margin: 25px 0 10px;
}
.register p a{
    text-decoration: none;
    color: #fff;
    font-weight: 600;
}
.register p a:hover{
    text-decoration: underline;
}
  </style>
</head>
<body>
  <section>
        <div class="form-box">
            <div class="form-value">
                <form action="">
    <h2>تسجيل الدخول</h2>
    <div class="inputbox">
      <ion-icon name="mail-outline"></ion-icon>
      <input type="email" required>
                        <label for="">البريد الالكتروني</label>
                    </div>
                    <div class="inputbox">
                        <ion-icon name="lock-closed-outline"></ion-icon>
                        <input type="password" required>
                        <label for="">كلمة المرور</label>
                    </div>
    <button>تسجيل الدخول</button>
                    <div class="register">
                        <p>ليس لديك حساب <a href="register.html">انشاء حساب</a></p>
                    </div>
                </form>
            </div>
        </div>
    </section>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>


  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, query, collection, where } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    // تهيئة Firebase
const firebaseConfig = {
  apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
  authDomain: "mr-tarek-2e40f.firebaseapp.com",
  projectId: "mr-tarek-2e40f",
  storageBucket: "mr-tarek-2e40f.firebasestorage.app",
  messagingSenderId: "807997869740",
  appId: "1:807997869740:web:8eca7473d24693bf861909"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();

      const identifier = document.getElementById('identifier').value;
      const password = document.getElementById('password').value;

      try {
        let email = identifier;

        // إذا كان الإدخال ليس بريدًا إلكترونيًا، البحث في قاعدة البيانات
        if (!identifier.includes('@')) {
          const usersRef = collection(db, "users"); // تأكد أن "users" هو اسم مجموعة المستخدمين لديك
          const q = query(usersRef, where("username", "==", identifier)); // البحث عن اسم المستخدم
          const querySnapshot = await getDoc(q);

          if (querySnapshot.empty) {
            alert("اسم المستخدم غير موجود. تأكد من المدخلات.");
            return;
          }

          // الحصول على البريد الإلكتروني للمستخدم
          querySnapshot.forEach((doc) => {
            email = doc.data().email;
          });
        }

        // تسجيل الدخول باستخدام البريد الإلكتروني
        await signInWithEmailAndPassword(auth, email, password);
        alert('تم تسجيل الدخول بنجاح!');
        window.location.href = 'index.html';
      } catch (error) {
        alert(`خطأ أثناء تسجيل الدخول: ${error.message}`);
      }
    });
  </script>
</body>
</html>
