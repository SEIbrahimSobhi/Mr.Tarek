<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        table, th, td {
            border: 1px solid #ccc;
        }

        th, td {
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .actions {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <h1>Admin Panel</h1>
    <table id="users-table">
        <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- سيتم ملء هذه المنطقة ديناميكيًا -->
        </tbody>
    </table>

    <script type="module">
        import { db } from './firebase-admin.js'; // تأكد من المسار الصحيح للملف
        import { collection, getDocs, doc, deleteDoc } from 'https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js';

        const usersRef = collection(db, 'users');

        async function fetchUsers() {
            try {
                const snapshot = await getDocs(usersRef);
                const usersTableBody = document.getElementById('users-table').querySelector('tbody');
                usersTableBody.innerHTML = '';

                snapshot.forEach((doc) => {
                    const userData = doc.data();
                    const row = document.createElement('tr');

                    row.innerHTML = `
                        <td>${userData.username}</td>
                        <td>${userData.email}</td>
                        <td>${userData.phone}</td>
                        <td class="actions">
                            <button onclick="deleteUser('${doc.id}')">Delete</button>
                        </td>
                    `;

                    usersTableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching users:', error);
            }
        }

        async function deleteUser(userId) {
            try {
                await deleteDoc(doc(db, 'users', userId));
                console.log('User deleted!');
                fetchUsers();
            } catch (error) {
                console.error('Error deleting user:', error);
            }
        }

        window.deleteUser = deleteUser; // تأكد من أن الوظيفة متاحة للنقر
        fetchUsers();
    </script>
</body>
</html>
