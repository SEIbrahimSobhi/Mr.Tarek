<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f9f9f9;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin: 20px 0;
}

table, th, td {
    border: 1px solid #ccc;
}

th, td {
    padding: 10px;
    text-align: left;
}

th {
    background-color: #f2f2f2;
}

tr:nth-child(even) {
    background-color: #f9f9f9;
}

.actions {
    display: flex;
    gap: 10px;
}
</style>
</head>
<body>
    <h1>Admin Panel</h1>
    <table id="users-table">
        <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- سيتم ملء هذه المنطقة ديناميكيًا -->
        </tbody>
    </table>
    <script src="admin-auth.js" type="module"></script>
    <script type="module">
    // Import the database reference from firebase-admin.js
import { db } from './firebase-admin.js';

// Reference to the Firestore collection
const usersRef = db.collection('users');

// Function to fetch and display users
function fetchUsers() {
    usersRef.get()
        .then((snapshot) => {
            const usersTableBody = document.getElementById('users-table').querySelector('tbody');
            usersTableBody.innerHTML = ''; // Clear the table body

            snapshot.forEach((doc) => {
                const userData = doc.data();
                const row = document.createElement('tr');

                row.innerHTML = `
                    <td>${userData.username}</td>
                    <td>${userData.email}</td>
                    <td>${userData.phone}</td>
                    <td class="actions">
                        <button onclick="deleteUser('${doc.id}')">Delete</button>
                    </td>
                `;

                usersTableBody.appendChild(row);
            });
        })
        .catch((error) => {
            console.error('Error getting users:', error);
        });
}

// Function to delete a user
function deleteUser(userId) {
    usersRef.doc(userId).delete()
        .then(() => {
            console.log('User deleted!');
            fetchUsers(); // Refresh the users list
        })
        .catch((error) => {
            console.error('Error deleting user:', error);
        });
}

// Fetch users on page load
fetchUsers();

    </script>
</body>
</html>
