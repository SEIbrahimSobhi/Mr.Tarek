<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الرياضيات التعليمية</title>
    <style>
body {
    font-family: 'Arial', sans-serif;
    background-color: #f8f9fa;
    margin: 0;
    padding: 0;
    direction: rtl;
    text-align: center;
}
.container {
    margin: 50px auto;
    width: 80%;
    max-width: 600px;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}
textarea {
    width: 100%;
    height: 100px;
    padding: 10px;
    margin-top: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
    resize: none;
}
button {
    padding: 10px 20px;
    margin-top: 10px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
button:hover {
    background-color: #0056b3;
}
#result {
    margin-top: 20px;
}
#solutionSteps {
    text-align: left;
}
    </style>
</head>
<body>
    <div class="container">
        <h1>منصة الرياضيات التعليمية</h1>
        <div class="input-section">
            <label for="question">أدخل السؤال:</label>
            <textarea id="question" placeholder="اكتب سؤالك هنا..."></textarea>
            <button id="submitQuestion">حل السؤال</button>
        </div>
        <div id="result">
            <h2>نتيجة الحل:</h2>
            <div id="solutionSteps"></div>
        </div>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-analytics.js";

// إعدادات Firebase الخاصة بك
    const firebaseConfig = {
      apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
      authDomain: "mr-tarek-2e40f.firebaseapp.com",
      projectId: "mr-tarek-2e40f",
      storageBucket: "mr-tarek-2e40f.appspot.com",
      messagingSenderId: "807997869740",
      appId: "1:807997869740:web:8eca7473d24693bf861909"
    };

// تهيئة Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// إضافة حدث للزر
document.getElementById('submitQuestion').addEventListener('click', async () => {
    const question = document.getElementById('question').value.trim();
    if (question) {
        // إرسال السؤال إلى قاعدة البيانات
        await addDoc(collection(db, "questions"), {
            question: question,
            createdAt: serverTimestamp()
        });

        // معالجة السؤال وعرض الحل
        displaySolution(question);
    }
});

// دالة لتحليل السؤال باستخدام OpenAI API
async function fetchAIAnswer(question) {
    const response = await fetch('https://api.openai.com/v1/completions', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer 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'
        },
        body: JSON.stringify({
            model: "text-davinci-003",
            prompt: `أعطني ملاحظات عن السؤال التالي وفكرته وطرق حله: ${question}`,
            max_tokens: 300
        })
    });
    const data = await response.json();
    return data.choices[0].text.trim();
}


// دالة لعرض الحل
function displaySolution(question) {
    const solutionSteps = document.getElementById('solutionSteps');
    solutionSteps.innerHTML = 'جاري تحليل السؤال...';

    fetchAIAnswer(question).then((answer) => {
        solutionSteps.innerHTML = `<p>الإجابة المتوقعة: ${answer}</p>`;
    }).catch((error) => {
        solutionSteps.innerHTML = `<p>لم نتمكن من إيجاد إجابة. يرجى المحاولة لاحقًا.</p>`;
    });
}
    </script>
</body>
</html>
