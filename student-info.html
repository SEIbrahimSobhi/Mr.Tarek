<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معلومات الطالب</title>
 <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
    }

    .container {
      margin-top: 50px;
    }

    .student-card {
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 20px;
      text-align: center;
    }

    .student-card h2 {
      font-size: 24px;
      color: #333;
      margin-bottom: 10px;
    }

    .student-card p {
      font-size: 18px;
      color: #666;
      margin: 5px 0;
    }

    .logout-btn {
      margin-top: 20px;
      background-color: #dc3545;
      color: #ffffff;
      border: none;
      border-radius: 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>
  <header>
    <h1>معلومات الطالب</h1>
  </header>
  <main>
    <div id="student-info">
      <p>جاري تحميل البيانات...</p>
    </div>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    // تهيئة Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
      authDomain: "mr-tarek-2e40f.firebaseapp.com",
      projectId: "mr-tarek-2e40f",
      storageBucket: "mr-tarek-2e40f.appspot.com",
      messagingSenderId: "807997869740",
      appId: "1:807997869740:web:8eca7473d24693bf861909"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const studentInfoDiv = document.getElementById("student-info");

    // التحقق من حالة تسجيل الدخول
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // جلب معرف المستخدم
        const userId = user.uid;

        // جلب بيانات المستخدم من Firestore
        const docRef = doc(db, "users", userId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const userData = docSnap.data();
          // عرض البيانات
          studentInfoDiv.innerHTML = `
            <h2>مرحبًا، ${userData.fullName}</h2>
            <p><strong>البريد الإلكتروني:</strong> ${user.email}</p>
            <p><strong>الصف الدراسي:</strong> ${userData.grade}</p>
            <p><strong>تاريخ التسجيل:</strong> ${new Date(user.metadata.creationTime).toLocaleDateString()}</p>
          `;
        } else {
          studentInfoDiv.innerHTML = `<p>لم يتم العثور على بيانات المستخدم.</p>`;
        }
      } else {
        studentInfoDiv.innerHTML = `<p>يرجى تسجيل الدخول لعرض معلوماتك.</p>`;
      }
    });
  </script>
</body>
</html>
