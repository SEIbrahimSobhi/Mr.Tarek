<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معلومات الطالب</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.rtl.min.css">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
    }

    .container {
      margin-top: 50px;
    }

    .student-card {
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 20px;
      text-align: center;
    }

    .student-card h2 {
      font-size: 24px;
      color: #333;
      margin-bottom: 10px;
    }

    .student-card p {
      font-size: 18px;
      color: #666;
      margin: 5px 0;
    }

    .logout-btn {
      margin-top: 20px;
      background-color: #dc3545;
      color: #ffffff;
      border: none;
      border-radius: 5px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="student-card">
      <h2>مرحبًا، <span id="student-name">اسم الطالب</span></h2>
      <p>البريد الإلكتروني: <span id="student-email">example@example.com</span></p>
      <p>رقم الحساب: <span id="student-id">123456</span></p>
      <button id="logout-btn" class="logout-btn">تسجيل الخروج</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

    // تهيئة Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDO4K33SYDaeBgYweqsEXni9QQ863DI_Pc",
      authDomain: "mr-tarek-2e40f.firebaseapp.com",
      projectId: "mr-tarek-2e40f",
      storageBucket: "mr-tarek-2e40f.appspot.com",
      messagingSenderId: "807997869740",
      appId: "1:807997869740:web:8eca7473d24693bf861909"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // عرض معلومات الطالب
    const studentNameEl = document.getElementById('student-name');
    const studentEmailEl = document.getElementById('student-email');
    const studentIdEl = document.getElementById('student-id');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        studentNameEl.textContent = user.displayName || "الاسم غير متوفر";
        studentEmailEl.textContent = user.email || "البريد الإلكتروني غير متوفر";
        studentIdEl.textContent = user.uid || "رقم الحساب غير متوفر";
      } else {
        // إذا لم يكن المستخدم مسجل الدخول، إعادة التوجيه للصفحة الرئيسية
        window.location.href = 'index.html';
      }
    });

    // تسجيل الخروج
    document.getElementById('logout-btn').addEventListener('click', async () => {
      try {
        await signOut(auth);
        alert('تم تسجيل الخروج بنجاح!');
        window.location.href = 'index.html'; // إعادة التوجيه للصفحة الرئيسية
      } catch (error) {
        console.error('خطأ أثناء تسجيل الخروج:', error);
        alert('حدث خطأ أثناء تسجيل الخروج.');
      }
    });
  </script>
</body>
</html>
